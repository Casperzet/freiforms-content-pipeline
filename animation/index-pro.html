<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter Display";src:url("assets/fonts/InterDisplay-400.woff") format("woff");font-weight:400}
@font-face{font-family:"Inter Display";src:url("assets/fonts/InterDisplay-500.woff") format("woff");font-weight:500}
@font-face{font-family:"Inter Display";src:url("assets/fonts/InterDisplay-600.woff") format("woff");font-weight:600}
@font-face{font-family:"Inter Display";src:url("assets/fonts/InterDisplay-700.woff") format("woff");font-weight:700}
@font-face{font-family:"Instrument Serif";src:url("assets/fonts/InstrumentSerif-Italic.woff") format("woff");font-style:italic}
html,body{margin:0;background:#000}
#stage{position:relative;width:540px;height:960px;overflow:hidden;font-family:"Inter Display",system-ui,sans-serif;color:#f4f1ec}
#c{position:absolute;inset:0;display:block}
#ov{position:absolute;inset:0;pointer-events:none}
/* editorial type system */
.brand{position:absolute;left:34px;top:40px;font-size:13px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgba(244,241,236,.62)}
.brand b{color:#ff8a6e;font-weight:600}
.big{position:absolute;left:30px;top:86px;font-size:168px;line-height:.86;font-weight:600;letter-spacing:-.06em;
  background:linear-gradient(180deg,#ffffff 0%,#d9d4cc 70%,#9c968e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.label{position:absolute;left:36px;font-size:30px;line-height:1.12;font-weight:500;letter-spacing:-.02em;color:#f4f1ec;width:440px}
.label em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;color:#ff8a6e;font-size:1.12em;letter-spacing:0}
.rule{position:absolute;left:36px;height:1px;width:64px;background:rgba(244,241,236,.4)}
.lower{position:absolute;left:36px;right:36px;bottom:170px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:rgba(244,241,236,.55);display:flex;justify-content:space-between}
</style></head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="ov"></div></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
const p = new URLSearchParams(location.search);
const s = p.get('s') || 'p1';
await Promise.all(['400','500','600','700'].map(w => document.fonts.load(`${w} 40px "Inter Display"`)).concat(document.fonts.load('italic 40px "Instrument Serif"')));
const tq = p.get('timing'); if (tq) window.TIMING = await (await fetch(`./timing/timing-${tq}.json`)).json();
const mod = await import(`./scene-${s}.js`);
const api = mod.build(document.getElementById('stage'), document.getElementById('ov'));
window.DURATION = api.duration; window.setT = t => api.update(t); window.setT(0); window.__ready = true;
</script></body></html>
